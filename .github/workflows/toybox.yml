name: toybox CI

on:
  schedule:
    - cron:  '0 2 * * *'
  push:
    branches: [ master ]

jobs:
  configure-build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [ macos-15, macos-26 ]
            os: macOS
            build_args: VERBOSE=all make macos_defconfig tests
          - runner: [ ubuntu-24.04, ubuntu-26.04 ]
            os: Ubuntu
            build_args: VERBOSE=all CC=clang make defconfig tests
    name: ${{ matrix.os }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v2
    - name: Setup
      run: |
        if [[ "${{ runner.os }}" == "macOS" ]]; then
          brew install gnu-sed
        else # Ubuntu
          sudo apt-get install build-essential
        fi
    - name: Configure, Build and Test
      run: ${{ matrix.build_args }}

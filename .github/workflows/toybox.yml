name: toybox CI

on:
  schedule:
    - cron:  '0 2 * * *'
  push:
    branches: [ master ]

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15, macos-26, xcode-27 ]
    name: macOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Setup
      run: brew install gnu-sed
    - name: Configure, Build and Test
      run: VERBOSE=all make macos_defconfig tests
        
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
          os: [ ubuntu-22.04, ubuntu-24.04, ubuntu-26.04 ]
    name: Ubuntu (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Setup
      run: sudo apt-get install build-essential
    - name: Configure, Build and Test
      run: VERBOSE=all CC=clang make defconfig tests
    - name: Capture mkpasswd backtrace
      if: failure() && matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y gdb
        printf 'password\n' > /tmp/mkpasswd.input
        gdb --batch \
          -ex 'set pagination off' \
          -ex 'run < /tmp/mkpasswd.input' \
          -ex 'bt full' \
          -ex 'info sharedlibrary' \
          --args generated/testdir/mkpasswd -P0 -mmd5 -S abcdefgh
